# Pre-commit hooks for the Admin Gateway repo.
# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
# Update hooks:  pre-commit autoupdate

repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8 (gateways + MCP + tests)
        args: ['--max-line-length=120']
        files: '^(gateway_common\.py|responses_bridge\.py|configure_claude\.py|mcp_launcher\.py|claude-minimax-proxy\.py|api2codex\.py|scripts/.*\.py|tests/.*\.py)$'

  - repo: local
    hooks:
      - id: py-compile
        name: py_compile (syntax check)
        entry: python -m py_compile
        language: system
        types: [python]
        pass_filenames: true
